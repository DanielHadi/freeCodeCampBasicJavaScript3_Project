<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephone Number Validator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="header-sect">
        <img src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg" alt="freeCodeCampLogo" id="img-logo">
        <h1 id="web-header">Telephone Number Validator</h1>
    </section>
    <section id="phone-sect">
        <div id="outer-phone">
            <div id="camera">
            </div>
            <div id="screen">
                <label for="user-input" id="label-input">Enter a Phone Number:</label>
                <input type="text" id="user-input">
                <span id="results-id"></span>
            </div>
            <div id="button">
                <button id="check-btn">Check</button>
                <button id="clear-btn">Clear</button>
            </div>
        </div>
    </section>
</body>
<script src="script.js"></script>
</html>
